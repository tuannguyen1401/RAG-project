<!DOCTYPE html>
<html lang="vi" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kho Tài Liệu & Tìm Kiếm File - RAG Intelligence Hub</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome 6 Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .file-explorer-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background: rgba(15, 23, 42, 0.75) !important;
            border: 1px solid rgba(255, 255, 255, 0.08) !important;
            border-radius: 20px !important;
        }
        .file-explorer-card:hover {
            transform: translateY(-4px);
            border-color: rgba(99, 102, 241, 0.5) !important;
            box-shadow: 0 12px 30px rgba(99, 102, 241, 0.2);
        }
        .file-cover-box {
            height: 180px;
            width: 100%;
            border-radius: 14px;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.4);
            position: relative;
        }
        .file-cover-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }
        .file-explorer-card:hover .file-cover-img {
            transform: scale(1.06);
        }
        .doc-icon-large {
            height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.5rem;
            border-radius: 14px;
            background: radial-gradient(circle at center, rgba(30, 41, 59, 0.8), rgba(15, 23, 42, 0.9));
        }
        .description-box {
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            padding: 12px;
            font-size: 0.85rem;
            color: #cbd5e1;
            max-height: 110px;
            overflow-y: auto;
            line-height: 1.5;
        }
        .search-hero-card {
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.8) 0%, rgba(15, 23, 42, 0.9) 100%);
            border: 1px solid rgba(99, 102, 241, 0.2);
            border-radius: 24px;
        }
    </style>
</head>

<body>
    <div class="container py-4 min-vh-100 d-flex flex-column gap-4">

        <!-- Top Header Navigation -->
        <header class="d-flex justify-content-between align-items-center p-3 rounded-4 glass-card border border-secondary-subtle">
            <div class="d-flex align-items-center gap-3">
                <div class="bg-primary bg-gradient text-white rounded-3 p-2.5 d-flex align-items-center justify-content-center shadow" style="width: 44px; height: 44px;">
                    <i class="fa-solid fa-folder-open fs-4"></i>
                </div>
                <div>
                    <h4 class="mb-0 fw-bold text-light">Kho Tài Liệu & Tìm Kiếm File</h4>
                    <p class="small text-secondary mb-0">Hệ Thống Tra Cứu File, Hình Ảnh & Mô Tả Tóm Tắt AI RAG</p>
                </div>
            </div>
            <div class="d-flex align-items-center gap-2">
                <a href="/" class="btn btn-outline-primary rounded-pill px-3 shadow-sm">
                    <i class="fa-solid fa-comments me-1.5"></i> Trở Về Chat RAG
                </a>
                <a href="/admin" class="btn btn-outline-warning rounded-pill px-3 shadow-sm">
                    <i class="fa-solid fa-user-shield me-1.5"></i> Admin Portal
                </a>
            </div>
        </header>

        <!-- Search Bar Hero Section -->
        <div class="card search-hero-card p-4 shadow-lg">
            <div class="row g-3 align-items-center">
                <div class="col-lg-7">
                    <label for="searchInput" class="form-label text-info fw-semibold mb-2">
                        <i class="fa-solid fa-magnifying-glass me-1.5"></i> Tìm kiếm theo tên file, mô tả (description) hoặc loại file:
                    </label>
                    <div class="input-group input-group-lg shadow-sm">
                        <span class="input-group-text bg-dark border-secondary text-info">
                            <i class="fa-solid fa-search"></i>
                        </span>
                        <input type="text" id="searchInput" class="form-control bg-dark text-light border-secondary fs-6" 
                               placeholder="Nhập tên file, từ khóa tóm tắt, đuôi file (.pdf, .png, .csv)...">
                        <button class="btn btn-outline-secondary text-light px-3" type="button" id="clearSearchBtn">
                            <i class="fa-solid fa-xmark me-1"></i> Xóa
                        </button>
                    </div>
                </div>
                <div class="col-lg-5 d-flex flex-column justify-content-end">
                    <label class="form-label text-secondary fw-semibold mb-2">Lọc theo định dạng:</label>
                    <div class="d-flex gap-2 flex-wrap" id="filterBtnGroup">
                        <button class="btn btn-outline-primary btn-filter active rounded-pill px-3 shadow-sm" data-filter="all">Tất Cả</button>
                        <button class="btn btn-outline-info btn-filter rounded-pill px-3 shadow-sm" data-filter="image">🖼️ Hình Ảnh</button>
                        <button class="btn btn-outline-warning btn-filter rounded-pill px-3 shadow-sm" data-filter="doc">📄 Tài Liệu Văn Bản</button>
                        <button class="btn btn-outline-success btn-filter rounded-pill px-3 shadow-sm" data-filter="csv">📊 Bảng Dữ Liệu</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Status & Counter Header -->
        <div class="d-flex justify-content-between align-items-center px-1">
            <div class="d-flex align-items-center gap-2">
                <span class="fs-5 fw-bold text-light">Danh Sách Kết Quả</span>
                <span class="badge bg-primary-subtle text-primary border border-primary-subtle rounded-pill px-3 py-1.5" id="totalCountBadge">
                    0 file
                </span>
            </div>
            <div class="small text-secondary">
                <i class="fa-solid fa-info-circle me-1"></i> Dữ liệu tự động đồng bộ từ thư mục <code>/docs/</code> & SQLite database
            </div>
        </div>

        <!-- File Cards Grid Container -->
        <div class="row g-4 flex-grow-1" id="fileCardsGrid">
            <div class="col-12 text-center py-5 text-secondary">
                <div class="spinner-border text-primary mb-3"></div>
                <p>Đang tải danh sách file và mô tả từ server...</p>
            </div>
        </div>

    </div>

    <!-- ── LIGHTBOX IMAGE PREVIEW MODAL ────────────────────────────────────── -->
    <div class="modal fade" id="imageLightboxModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content glass-card border-secondary text-light">
                <div class="modal-header border-bottom border-secondary p-3 px-4">
                    <h5 class="modal-title fw-bold text-light" id="lightboxTitle">Chi Tiết Hình Ảnh</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body text-center p-4">
                    <img src="" id="lightboxImg" class="lightbox-img-preview img-fluid rounded-3" alt="Preview">
                </div>
                <div class="modal-footer border-top border-secondary p-3 px-4 d-flex justify-content-between">
                    <span class="text-secondary small" id="lightboxMeta"></span>
                    <div>
                        <a href="#" id="lightboxDownloadBtn" download class="btn btn-primary rounded-pill me-2 px-4">
                            <i class="fa-solid fa-download me-1.5"></i> Tải Ảnh Về
                        </a>
                        <button type="button" class="btn btn-outline-secondary rounded-pill px-3" data-bs-dismiss="modal">Đóng</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Files Explorer JS -->
    <script src="/static/files.js?v=1"></script>
</body>

</html>
